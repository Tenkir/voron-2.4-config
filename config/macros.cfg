#####################################################################
#   Macros
#####################################################################

# Exhaust Fan
[gcode_macro M106]
rename_existing: M106.1
gcode:
    {% set fan = 'exhaust_fan' %}
    {% set speed = (params.S|float / 255 if params.S is defined else 1.0) %}
    SET_FAN_SPEED FAN={fan} SPEED={speed}

[gcode_macro PARK]
gcode:
    {% set th = printer.toolhead %}
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y//2} Z30

[gcode_macro G32]
gcode:
    SAVE_GCODE_STATE NAME=STATE_G32
    G90                             ; absolute positioning
    QUAD_GANTRY_SCAN
    G28
    BED_MESH_CALIBRATE
    RESTORE_GCODE_STATE NAME=STATE_G32

[gcode_macro PRINT_START]
gcode:
    # Parameters
    {% set bedtemp = params.BED|int %}
    {% set hotendtemp = params.HOTEND|int %}
    {% set chambertemp = params.CHAMBER|default(0)|int %}

    BED_MESH_CLEAR               ; clear existing bed mesh
    SET_GCODE_OFFSET Z=0

    G28                            ; home machine
    G90                            ; absolute positioning

    CLEAN_NOZZLE_PARK

    SET_FAN_SPEED FAN=Nevermore SPEED=1

    M140 S{bedtemp}                ; start bed heater
    M109 S{hotendtemp}             ; set & wait for hotend temp
    M190 S{bedtemp}                ; wait for bed temp

    CLEAN_NOZZLE

    G28 Z METHOD=CONTACT CALIBRATE=1    ; calibrate z offset and beacon model hot
    G32                                 ; initialize with QGL and Bed Mesh
    G28 Z METHOD=CONTACT CALIBRATE=0    ; calibrate z offset only after tilt/mesh

    SET_GCODE_OFFSET Z=0.06     ; add a little offset for hotend thermal expansion
                                ; needs fine tuning, long meltzones require more
    PRIME_NOZZLE
    ## PARK                           ; move nozzle away from endstop



[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
    # safe anti-stringing move coords
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 20, th.axis_maximum.z]|min %}

    SAVE_GCODE_STATE NAME=STATE_PRINT_END

    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-5.0 F1800                 ; retract filament

    TURN_OFF_HEATERS

    G90                            ; absolute positioning
    G0 Z{z_safe} F3600             ; move nozzle up
    G0 X{x_safe} Y{y_safe} F20000  ; move nozzle to remove stringing
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F3600  ; park nozzle at rear
    M107                                     ; turn off fan

    UPDATE_DELAYED_GCODE ID=filter_off DURATION=180

    BED_MESH_CLEAR
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END

[gcode_macro QUAD_GANTRY_SCAN]
gcode:
    QUAD_GANTRY_LEVEL horizontal_move_z=10 retry_tolerance=1.000
    QUAD_GANTRY_LEVEL horizontal_move_z=2

[gcode_macro CLEAN_NOZZLE_PARK]
gcode:
 {% if "xyz" not in printer.toolhead.homed_axes %}
   G28
 {% endif %}

  G90

  ## Ooze position. Set this position right above the bucket.
  G1 X322 Y348 Z1 F6000

[gcode_macro CLEAN_NOZZLE]
variable_start_x: 298   ; The nozzle right edge of the scrubber.
variable_start_y: 348  ; The nozzle is above the rear row of bristles.
variable_start_z: .25   ; Set this Z distance so that the nozzle tip is buried in the scrubber.
variable_wipe_dist: -35
variable_wipe_qty: 5
variable_wipe_spd: 200
variable_raise_distance: 10

gcode:
 {% if "xyz" not in printer.toolhead.homed_axes %}
   G28
 {% endif %}

 G90                                            ; absolute positioning

 ## Move nozzle to start position
 G1 X{start_x} Y{start_y} F6000
 G1 Z{start_z} F1500

 ## Wipe nozzle
 {% for wipes in range(1, (wipe_qty + 1)) %}
   G1 X{start_x + wipe_dist} Y{start_y} F{wipe_spd * 60}
   G1 X{start_x} Y{start_y} F{wipe_spd * 60}
   G1 X{start_x + wipe_dist} Y{start_y - 5} F{wipe_spd * 60}
   G1 X{start_x} Y{start_y -5} F{wipe_spd * 60}
 {% endfor %}

 ## Raise nozzle
 G1 X{start_x + 8} Z{raise_distance}

[gcode_macro PRIME_NOZZLE]
gcode:
    SAVE_GCODE_STATE NAME=PRIME_NOZZLE_STATE

    M117 Priming
    G90 ; Absolute coordinates.
    M83 ; Relative extruder mode.
    G92 E0
    G1 Z10 F900 ; Move to start of line.
    G1 Y3 X3 F18000 ; Print the line.
    G1 Z0.2 F900
    G91 ; Relative coordinates.
    G1 X100 E25 F1000 ; Extrude filament 25mm (how much it retracted in PRINT_END).
    G1 Y-2 F1000
    G1 X-60 E9 F1000 ; Print second part of the line.
    G1 E-0.5 F3000 ; Retract to avoid stringing.
    G1 X0.5 E0 F1000 ; Wipe back to break string.
    G1 X-5.5 E0 F1000 ; Wipe forward to break string.

    RESTORE_GCODE_STATE NAME=PRIME_NOZZLE_STATE
