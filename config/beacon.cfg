########################################
# Beacon Probe
# ########################################
[beacon]
serial: /dev/serial/by-id/usb-Beacon_Beacon_RevH_1B19D6CA5157355957202020FF0D330F-if00
x_offset: 22.5 # update with offset from nozzle on your machine
y_offset: 0 # update with offset from nozzle on your machine
mesh_main_direction: x
mesh_runs: 2

# Enable Contact Auto-Calibration with Beacon Contact
contact_max_hotend_temperature: 180
home_xy_position: 175, 175
home_z_hop: 5
home_z_hop_speed: 30
home_xy_move_speed: 300
home_method: proximity
home_method_when_homed: proximity
home_autocalibrate: never